name = "personal-os-cron"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Trigger every 3 hours WIB: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 WIB
# UTC equivalents: 17:00, 20:00, 23:00, 02:00, 05:00, 08:00, 11:00, 14:00
[triggers]
crons = ["0 2,5,8,11,14,17,20,23 * * *"]

# Environment variables needed (set these in Cloudflare Dashboard or .dev.vars)
# GEMINI_API_KEY = "..."
# TTS_URL = "https://ifjika-personal-os.hf.space"
# TELEGRAM_BOT_TOKEN = "..."
# TELEGRAM_CHAT_ID = "..."
