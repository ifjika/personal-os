name = "personal-os-cron"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Trigger every 6 hours WIB: 00:00, 06:00, 12:00, 18:00 WIB (17:00, 23:00, 05:00, 11:00 UTC)
[triggers]
crons = ["0 5,11,17,23 * * *"]

# Environment variables needed (set these in Cloudflare Dashboard or .dev.vars)
# GEMINI_API_KEY = "..."
# TTS_URL = "https://ifjika-personal-os.hf.space"
# TELEGRAM_BOT_TOKEN = "..."
# TELEGRAM_CHAT_ID = "..."
